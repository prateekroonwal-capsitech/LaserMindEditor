<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="exitGateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <!-- Outer portal frame -->
  <rect x="14" y="14" width="100" height="100" rx="14" fill="#111827" stroke="#10b981" stroke-width="4"/>
  <!-- Inner portal background -->
  <rect x="22" y="22" width="84" height="84" rx="8" fill="url(#exitGateGrad)"/>
  <!-- Doorway opening -->
  <path d="M 40 96 L 40 48 A 24 24 0 0 1 88 48 L 88 96 Z" fill="url(#doorGrad)" stroke="#34d399" stroke-width="2"/>
  <!-- Exit arrow pointing forward/up -->
  <polygon points="64,42 76,58 68,58 68,78 60,78 60,58 52,58" fill="#ffffff"/>
  <!-- Glowing indicator bottom bar -->
  <rect x="36" y="86" width="56" height="4" rx="2" fill="#6ee7b7"/>
</svg>
