  <polygon points="64,116 64,64 116,64" fill="#5a189a" fill-opacity="0.4"/>
  <line x1="64" y1="12" x2="64" y2="116" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="12" y1="64" x2="116" y2="64" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <circle cx="64" cy="64" r="8" fill="#ffffff"/>
</svg>
