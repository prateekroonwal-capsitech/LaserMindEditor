<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="splitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>
  </defs>
  <!-- Optical diamond body -->
  <polygon points="64,12 116,64 64,116 12,64" fill="url(#splitGrad)" stroke="#e0aaff" stroke-width="4"/>
