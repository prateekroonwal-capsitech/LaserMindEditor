<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="moveGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5799" />
      <stop offset="100%" stop-color="#207cca" />
    </linearGradient>
    <linearGradient id="mirrorGlassM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0f4ff" />
      <stop offset="70%" stop-color="#8ac8f8" />
      <stop offset="100%" stop-color="#4a9de3" />
    </linearGradient>
  </defs>
  <!-- Movable frame base with blue neon border -->
  <rect x="14" y="14" width="100" height="100" rx="18" fill="#131e2b" stroke="#00b4d8" stroke-width="4"/>
  <!-- Grip handles / dots indicating movable item -->
  <circle cx="28" cy="28" r="6" fill="#00b4d8"/>
  <circle cx="100" cy="28" r="6" fill="#00b4d8"/>
  <circle cx="28" cy="100" r="6" fill="#00b4d8"/>
  <circle cx="100" cy="100" r="6" fill="#00b4d8"/>
  <!-- Directional drag arrow indicators -->
  <polygon points="64,20 58,26 70,26" fill="#00b4d8"/>
  <polygon points="64,108 58,102 70,102" fill="#00b4d8"/>
  <polygon points="20,64 26,58 26,70" fill="#00b4d8"/>
  <polygon points="108,64 102,58 102,70" fill="#00b4d8"/>
  <!-- Mirror backing -->
  <line x1="28" y1="28" x2="100" y2="100" stroke="#0d3056" stroke-width="18" stroke-linecap="round"/>
  <!-- Mirror glass -->
  <line x1="28" y1="28" x2="100" y2="100" stroke="url(#mirrorGlassM)" stroke-width="10" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="90" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
