<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="entryGateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="entryDoorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>
  <!-- Security frame -->
  <rect x="14" y="14" width="100" height="100" rx="14" fill="#18181b" stroke="#ef4444" stroke-width="4"/>
  <!-- Blast door bars -->
  <rect x="22" y="22" width="84" height="84" rx="8" fill="url(#entryGateGrad)"/>
  <!-- Doorway opening -->
  <path d="M 40 96 L 40 48 A 24 24 0 0 1 88 48 L 88 96 Z" fill="url(#entryDoorGrad)" stroke="#fca5a5" stroke-width="2"/>
  <!-- Crossing security lasers/bars -->
  <line x1="40" y1="56" x2="88" y2="88" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="88" y1="56" x2="40" y2="88" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Laser emission indicator / badge -->
  <circle cx="64" cy="46" r="10" fill="#ffffff"/>
  <circle cx="64" cy="46" r="6" fill="#ef4444"/>
</svg>
