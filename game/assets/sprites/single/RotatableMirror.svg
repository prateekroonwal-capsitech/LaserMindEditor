<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="rotRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f77f00" />
    </linearGradient>
    <linearGradient id="mirrorGlassR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e8f8ff" />
      <stop offset="100%" stop-color="#64b5f6" />
    </linearGradient>
  </defs>
  <!-- Circular bearing platform -->
  <circle cx="64" cy="64" r="54" fill="#1b1e24" stroke="#495057" stroke-width="3"/>
  <!-- Gold rotation track with teeth / notches -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#rotRing)" stroke-width="4" stroke-dasharray="14, 6"/>
  <!-- Rotation arrow icons -->
  <path d="M 64 20 A 44 44 0 0 1 108 64" fill="none" stroke="#ffd166" stroke-width="2"/>
  <polygon points="108,64 104,56 114,58" fill="#ffd166"/>
  <!-- Center turret slot -->
  <circle cx="64" cy="64" r="38" fill="#121418"/>
  <!-- Mirror bar -->
  <line x1="32" y1="32" x2="96" y2="96" stroke="#2c3038" stroke-width="16" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="96" y2="96" stroke="url(#mirrorGlassR)" stroke-width="10" stroke-linecap="round"/>
  <line x1="42" y1="42" x2="86" y2="86" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
