  <rect x="22" y="22" width="84" height="84" rx="8" fill="url(#gateGrad)"/>
  <line x1="22" y1="22" x2="106" y2="106" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
  <line x1="106" y1="22" x2="22" y2="106" stroke="#ffffff" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Lock badge -->
  <circle cx="64" cy="64" r="14" fill="#ffffff"/>
  <circle cx="64" cy="64" r="8" fill="#9d0208"/>
